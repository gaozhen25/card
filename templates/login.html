<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>后台登录 - 外链卡片系统</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
.card{background:#fff;width:360px;padding:30px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h2{text-align:center;color:#222;margin-top:0}
.item{margin:14px 0}
.item label{display:block;margin-bottom:5px;font-size:14px;color:#555}
.item input{width:100%;padding:10px;border:1px solid #d9d9d9;border-radius:4px;box-sizing:border-box}
.btn{width:100%;padding:11px;background:#2779bd;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:15px}
.btn:hover{background:#1f669f}
.err{color:#e74c3c;text-align:center;margin-bottom:10px;font-size:14px}
</style>
</head>
<body>
<div class="card">
    <h2>外链卡片系统</h2>
    {% if err %}<div class="err">{{ err }}</div>{% endif %}
    <form method="post">
        <div class="item"><label>用户名</label><input type="text" name="username" value="admin" required></div>
        <div class="item"><label>密码</label><input type="password" name="password" required></div>
        <div class="item"><button class="btn" type="submit">登 录</button></div>
    </form>
</div>
</body>
</html>
