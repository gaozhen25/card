{% extends "base.html" %}
{% block content %}
<div class="box">
    <div class="box-header">
        <h3>IP 黑名单管理</h3>
        <a class="btn" href="{{ url_for('admin_index') }}">返回列表</a>
    </div>
    <form method="post" style="display:flex;gap:8px;margin-bottom:16px">
        <input type="text" name="ip" placeholder="IP 地址" required>
        <input type="text" name="remark" placeholder="备注">
        <button class="btn btn-primary" type="submit">加入黑名单</button>
    </form>
    {% if list_ %}
    <table>
        <thead>
        <tr><th>ID</th><th>IP</th><th>备注</th><th>添加时间</th><th>操作</th></tr>
        </thead>
        <tbody>
        {% for v in list_ %}
        <tr>
            <td>{{ v['id'] }}</td>
            <td>{{ v['ip'] }}</td>
            <td>{{ v['remark'] }}</td>
            <td>{{ v['create_time']|fmt_time }}</td>
            <td><a class="btn btn-danger" href="{{ url_for('admin_blackip_del', bid=v['id']) }}" onclick="return confirm('确认移除？')">移除</a></td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    {% else %}
    <div class="empty">黑名单为空</div>
    {% endif %}
</div>
<style>
input[type=text]{padding:8px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;width:220px}
</style>
{% endblock %}
