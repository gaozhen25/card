<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>外链卡片管理系统</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f6fa}
.layout{display:flex;min-height:100vh}
.sidebar{width:210px;background:#1f2d3d;color:#fff;padding-top:20px;flex-shrink:0}
.brand{font-size:16px;font-weight:600;padding:0 20px 20px;border-bottom:1px solid #2c3e50}
.sidebar a{display:block;color:#b8c2cc;padding:12px 20px;text-decoration:none;font-size:14px}
.sidebar a:hover{background:#2c3e50;color:#fff}
.main{flex:1;padding:24px}
.box{background:#fff;border:1px solid #e6e8eb;border-radius:6px;padding:20px}
.box-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.box-header h3{margin:0;font-size:17px;color:#222}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #e6e8eb;padding:9px 10px;font-size:13px;text-align:left}
th{background:#f7f8fa;color:#333;font-weight:600}
tr:hover td{background:#fafbfc}
.btn{display:inline-block;padding:6px 12px;border:none;border-radius:4px;cursor:pointer;text-decoration:none;font-size:13px;background:#f0f2f5;color:#333}
.btn:hover{background:#e4e7eb}
.btn-primary{background:#2779bd;color:#fff}
.btn-primary:hover{background:#1f669f}
.btn-danger{background:#fff;color:#e74c3c;border:1px solid #e74c3c}
.linkbox{display:flex;gap:6px;align-items:center}
.linkbox input{border:1px solid #d9d9d9;border-radius:4px;padding:6px;font-size:12px;color:#555;width:300px}
.pager{margin-top:14px;font-size:13px;color:#666}
.pager a{display:inline-block;padding:3px 8px;margin:0 2px;border:1px solid #d9d9d9;border-radius:3px;text-decoration:none;color:#2779bd}
.pager a:hover{background:#eef4fb}
.empty{color:#999;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="layout">
    <div class="sidebar">
        <div class="brand">外链卡片系统</div>
        <a href="{{ url_for('admin_index') }}">卡片列表</a>
        <a href="{{ url_for('admin_edit') }}">新增卡片</a>
        <a href="{{ url_for('admin_log') }}">访问日志</a>
        <a href="{{ url_for('admin_blackip') }}">IP 黑名单</a>
        <a href="{{ url_for('logout') }}">退出登录</a>
    </div>
    <div class="main">
        {% block content %}{% endblock %}
    </div>
</div>
</body>
</html>
